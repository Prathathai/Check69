<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็คตรวจเขตพื้นที่ สภานักเรียน</title>
<!-- ไฟล์เดียวใช้ได้ทั้งบน Claude (ซิงก์ผ่านระบบกลาง) และบน GitHub Pages (เก็บใน localStorage ของเบราว์เซอร์) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#fff;--tx:#1a1d23;--mu:#667085;--ln:#e4e7ec;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--lv:#a16207;--lvb:#fef3c7;--in:#1d4ed8;--inb:#dbeafe;
--blue:#2f80ed;--yellow:#eab308;--green:#22a559;--red:#e5484d;--purple:#8e4ec6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d24;--tx:#eceef2;--mu:#98a2b3;--ln:#2b2f38;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1717;--lv:#fbbf24;--lvb:#3a2c0b;--in:#60a5fa;--inb:#14263f}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d24;--tx:#eceef2;--mu:#98a2b3;--ln:#2b2f38;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1717;--lv:#fbbf24;--lvb:#3a2c0b;--in:#60a5fa;--inb:#14263f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Noto Sans Thai",system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--ln);padding:12px 16px;z-index:9}
h1{font-size:18px;margin:0;font-weight:700}
.sub{color:var(--mu);font-size:13px}
main{max-width:560px;margin:0 auto;padding:12px 14px}
.row{display:flex;gap:8px;align-items:center}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);background:var(--card);border-radius:10px;min-height:44px}
button{cursor:pointer;border:1px solid var(--ln);background:var(--card);border-radius:10px;min-height:44px;padding:0 12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.prog{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--ok)}
.sc{display:block;width:100%;text-align:left;border-radius:14px;padding:14px;margin-bottom:10px;height:auto}
.sc b{font-size:22px}
.sc .row{justify-content:space-between}
.pill{border-radius:10px;padding:0 10px;font-size:12px;font-weight:600;background:var(--ln);color:var(--mu)}
.pill.on{background:var(--okb);color:var(--ok)}
.dtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.dtabs button{display:block;min-height:60px;padding:4px;font-size:13px;line-height:1.3;text-align:center}
.dtabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.m{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.m b{font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.btns button{font-weight:600;font-size:15px}
.btns .p.on{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.btns .e.on{background:var(--inb);color:var(--in);border-color:var(--in)}
.btns .a.on{background:var(--nob);color:var(--no);border-color:var(--no)}
.btns .l.on{background:var(--lvb);color:var(--lv);border-color:var(--lv)}
.pn{margin-top:8px;font-size:14px;font-weight:600}
.bad{color:var(--no)}.good{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:10px;padding:8px 10px}
.t .n{font-size:26px;font-weight:700;line-height:1.1}
.t:last-child:nth-child(odd){grid-column:span 2}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}
.li .g{flex:1;min-width:0}
.cnt{font-weight:700;color:var(--no);white-space:nowrap}
.empty{color:var(--mu);text-align:center;padding:20px 0}
.pl{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1px solid var(--ln);border-left:6px solid var(--c);border-radius:8px;padding:4px 10px;font-weight:600;font-size:14px}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld label{font-size:13px;color:var(--mu)}
.dn.on{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.dn{min-height:36px;font-size:13px;white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:6px}
.lg span{display:inline-flex;align-items:center;gap:5px}
svg text{fill:var(--mu);font-size:10px}
.sb{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:8px 0}
.sb i{display:block;height:100%}
.ban{background:var(--lvb);color:var(--lv);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;text-align:center;z-index:11;font-size:14px}
#toast[hidden]{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;font-weight:600;color:var(--mu);padding:0 4px}
nav button.on{color:var(--tx);box-shadow:inset 0 -3px 0 var(--tx);border-radius:0}
</style>
</head>
<body>
<header><h1>เช็คตรวจเขตพื้นที่</h1><div class="sub" id="dl"></div></header>
<main id="app"></main>
<div id="toast" hidden></div>
<nav id="nav"></nav>
<script>
const TEAMS=[["yellow","เหลือง"],["green","เขียว"],["blue","ฟ้า"],["red","แดง"],["purple","ม่วง"]];
const TN=Object.fromEntries(TEAMS);
const G=[["ปาล์ม","บอส","แฟน","ฟีฟ่า","วุ้นเส้น"],["ตะวัน","ลูกหว้า","อัญญา","เอเชีย","เมษา"],["พัด","ออมสิน","ฟ้า","พัตเตอร์","โฟกัส"]];
const SCH={A:[0,1,2,0,1],B:[2,1,0,2,1],C:[0,2,1,0,2]};
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"],AB=["จ.","อ.","พ.","พฤ.","ศ."];
const ST={p:"มาตรวจ",e:"แจ้งก่อน 07:00 น.",a:"ไม่มาตรวจ ไม่แจ้ง",l:"ส่งรายงานช้า"};
const SC={p:"ok",e:"in",a:"no",l:"lv"},WK=6048e5,DY=864e5;
const LS="zone-inspect-v3",pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const U=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const fmt=ms=>{const d=new Date(ms);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())};
const dow=s=>(new Date(U(s)).getUTCDay()+6)%7;
const mon=s=>U(s)-dow(s)*DY;
const sd=ms=>new Date(ms).toLocaleDateString("th-TH",{day:"numeric",month:"short",timeZone:"UTC"});
const sd2=ms=>new Date(ms).getUTCDate()+"/"+(new Date(ms).getUTCMonth()+1);
const DEF={anchor:"2026-11-02",mode:"type",base:{a:20,l:10}};
let S={...DEF,names:null,people:[],rec:{},done:{}};
const mk=()=>{S.people=G.flat().map((n,i)=>({id:i+1,name:(S.names&&S.names[i])||n,team:TEAMS[i%5][0]}))};mk();
const setOf=s=>"ABC"[((Math.round((mon(s)-mon(S.anchor))/WK)%3)+3)%3];
const wkFor=k=>{const t=todayStr();return mon(t)+(("ABC".indexOf(k)-"ABC".indexOf(setOf(t))+3)%3)*WK};
let db=null,canWrite=true,ld=false,view="home",date=todayStr(),showAll=false;
const rd={c:0,r:0},q={};let LD={cfg:null,recs:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dotc=t=>`<span class="dot" style="background:var(--${t})"></span>`;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4000)}

/* ---------- ชั้นเก็บข้อมูล: cloud (Claude db) หรือ local (localStorage) ---------- */
const cfgObj=()=>({anchor:S.anchor,mode:S.mode,base:S.base,names:S.people.map(p=>p.name)});
function applyCfg(d){d=d||{};S.anchor=d.anchor||DEF.anchor;S.mode=d.mode||DEF.mode;S.base={a:(d.base&&d.base.a)||20,l:(d.base&&d.base.l)||10};S.names=d.names||null;mk()}
function applyRecs(list){S.rec={};S.done={};list.forEach(v=>{(S.rec[v.date]||(S.rec[v.date]={}))[v.id]=v.s;if(v.done)S.done[v.date+"|"+v.id]=1})}
const lsave=()=>{try{localStorage.setItem(LS,JSON.stringify(LD))}catch(e){toast("บันทึกในเครื่องไม่สำเร็จ")}};
const lload=()=>{applyCfg(LD.cfg);applyRecs(Object.values(LD.recs))};
const wr=(k,f)=>{q[k]=(q[k]||Promise.resolve()).then(f).catch(e=>toast("บันทึกไม่สำเร็จ ("+((e&&e.code)||"error")+")"))};
function setRec(id,s){const k=date+"_"+id,cur=(S.rec[date]||{})[id];
  if(db)wr(k,()=>cur===s?db.doc("rec/"+k).delete():db.doc("rec/"+k).set({date,id,s,done:false}));
  else{if(cur===s)delete LD.recs[k];else LD.recs[k]={date,id,s,done:false};lsave();lload();render()}}
function togDone(key){const[dt,id]=key.split("|"),k=dt+"_"+id,was=!!S.done[key];
  if(db)wr(k,()=>db.doc("rec/"+k).update({done:!was}));
  else if(LD.recs[k]){LD.recs[k].done=!was;lsave();lload();render()}}
function saveCfg(){if(db)wr("cfg",()=>db.doc("config/main").set(cfgObj()));else{LD.cfg=cfgObj();lsave()}}

/* ---------- คำนวณโทษ: คูณ 2 ทุกครั้งที่โดนซ้ำ ---------- */
function pen(){const o={},c={};
  Object.keys(S.rec).sort().forEach(d=>{const r=S.rec[d];
    Object.keys(r).map(Number).sort((x,y)=>x-y).forEach(id=>{const s=r[id];if(s!=="a"&&s!=="l")return;
      const z=c[id]||(c[id]={a:0,l:0,t:0}),pr=S.mode==="all"?z.t:z[s];
      o[d+"|"+id]={d,id,s,n:pr+1,pieces:S.base[s]*2**pr};z[s]++;z.t++})});
  return o}

/* ---------- หน้าจอ ---------- */
function render(){
  $("#dl").textContent=new Date(U(date)).toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
  $("#nav").innerHTML=[["home","ชุดตรวจ"],["sum","สรุป"],["cfg","ตั้งค่า"]].map(([k,l])=>`<button data-v="${k}" class="${view===k||(k==="home"&&view==="check")?"on":""}">${l}</button>`).join("");
  const ban=db&&!canWrite?'<div class="ban">โหมดดูอย่างเดียว ถ้าจะเช็คชื่อ ให้เจ้าของลิงก์ตั้งสิทธิ์ให้แก้ไขได้</div>':"";
  $("#app").innerHTML=!ld?'<div class="empty">กำลังโหลดข้อมูล…</div>':ban+{home:vHome,check:vCheck,sum:vSum,cfg:vSet}[view]();
}

function vHome(){
  const t=todayStr(),wd=dow(t),cur=setOf(t);
  const cards=["A","B","C"].map(k=>{const m=wkFor(k),ahead=Math.round((m-mon(t))/WK);let n=0,o=0;
    for(let j=0;j<5;j++){const r=S.rec[fmt(m+j*DY)]||{};for(const id in r){n++;if(r[id]==="a"||r[id]==="l")o++}}
    return `<button class="sc" data-pick="${k}"><div class="row"><b>ชุด ${k}</b><span class="pill ${ahead?"":"on"}">${ahead?ahead===1?"สัปดาห์หน้า":"อีก 2 สัปดาห์":"สัปดาห์นี้"}</span></div>
    <div class="sub">${sd(m)} – ${sd(m+4*DY)}</div><div class="sub">เช็คแล้ว ${n}/25 · โดนโทษ ${o} ครั้ง</div></button>`}).join("");
  const quick=wd<5?`<button class="sc" data-a="gotoday"><div class="sub">เวรวันนี้ · ชุด ${cur} · วัน${DAYS[wd]}</div><div class="pl" style="margin-top:6px">${TEAMS.map(([k],ti)=>`<span class="pc" style="--c:var(--${k})">${esc(S.people[SCH[cur][wd]*5+ti].name)}</span>`).join("")}</div></button>`:"";
  return `<div class="sub" style="margin-bottom:8px">เลือกชุดที่จะเช็ค</div>${cards}${quick}`;
}

function vCheck(){
  if(dow(date)>4)date=fmt(mon(date));
  const P=pen(),w=dow(date),set=setOf(date),m=mon(date),t=todayStr(),r=S.rec[date]||{};
  const days=[0,1,2,3,4].map(i=>{const d=fmt(m+i*DY),rr=S.rec[d]||{},n=Object.keys(rr).length,o=Object.values(rr).some(s=>s==="a"||s==="l");
    return `<button class="${d===date?"on":""}" ${d===t?'style="border-color:var(--blue)"':""} data-day="${d}">${AB[i]}<br><b>${new Date(m+i*DY).getUTCDate()}</b><br><span style="font-size:12px">${n}/5${o?' <i class="dot" style="background:var(--red);width:8px;height:8px"></i>':""}</span></button>`}).join("");
  const g=SCH[set][w],ids=TEAMS.map((_,ti)=>g*5+ti+1),done=ids.filter(i=>r[i]).length;
  const cards=ids.map(id=>{const p=S.people[id-1],s=r[id],x=P[date+"|"+id];let note="";
    if(x)note=`<div class="pn bad">โทษ: เก็บขยะ ${x.pieces} ชิ้น (ครั้งที่ ${x.n}${S.done[date+"|"+id]?" · เก็บแล้ว":""})</div>`;
    else if(s)note=`<div class="pn good">ปกติ ไม่มีโทษ</div>`;
    return `<div class="m" style="--c:var(--${p.team})"><b>${esc(p.name)}</b><div class="sub">คณะสี${TN[p.team]}</div>
    <div class="btns">${["p","e","a","l"].map(k=>`<button class="${k} ${s===k?"on":""}" data-m="${id}" data-s="${k}">${ST[k]}</button>`).join("")}</div>${note}</div>`}).join("");
  return `<div class="row"><button data-v="home">‹ เลือกชุด</button><div style="flex:1;text-align:center"><b>ชุด ${set}</b><div class="sub">${sd(m)} – ${sd(m+4*DY)}</div></div>
  <button data-wk="-21" aria-label="ย้อนไปรอบก่อนของชุดนี้">‹</button><button data-wk="21" aria-label="ไปรอบถัดไปของชุดนี้">›</button></div>
  <div class="dtabs">${days}</div>
  <div class="sub"><b>วัน${DAYS[w]}</b> · เช็คแล้ว ${done} จาก 5 คน</div><div class="prog"><i style="width:${done*20}%"></i></div>${cards}
  <div class="sub">ปุ่ม ‹ › ข้ามไปสัปดาห์ที่ใช้ชุดเดียวกัน (ทุก 3 สัปดาห์)</div>`;
}

/* ---------- กราฟ (SVG ล้วน ไม่ต้องใช้ไลบรารี) ---------- */
const CW=340,CH=170,PL=28,PR=8,PT=8,PB=22,IW=CW-PL-PR,IH=CH-PT-PB;
const svg=s=>`<svg viewBox="0 0 ${CW} ${CH}" width="100%" role="img">${s}</svg>`;
const grid=(mx,Y)=>[...new Set([0,Math.ceil(mx/2),mx])].map(v=>`<line x1="${PL}" x2="${CW-PR}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--ln)"/><text x="${PL-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join("");
const xl=(i,n,x,l)=>n<=8||i%2===0?`<text x="${x}" y="${CH-6}" text-anchor="middle">${l}</text>`:"";
const lg=a=>`<div class="lg">${a.map(([c,l])=>`<span><i class="dot" style="background:var(--${c})"></i>${l}</span>`).join("")}</div>`;
function barC(W){const mx=Math.max(1,...W.map(w=>w.a+w.l)),bw=IW/W.length,Y=v=>PT+IH-v/mx*IH;let s=grid(mx,Y);
  W.forEach((w,i)=>{const x=PL+i*bw+bw*.15,b=bw*.7;
    s+=`<rect x="${x}" y="${Y(w.l)}" width="${b}" height="${Y(0)-Y(w.l)}" style="fill:var(--lv)"/><rect x="${x}" y="${Y(w.l+w.a)}" width="${b}" height="${Y(w.l)-Y(w.l+w.a)}" style="fill:var(--no)"/>`+xl(i,W.length,PL+i*bw+bw/2,sd2(w.m))});
  return svg(s)}
function lineC(W,pre){const n=W.length,cum={};
  TEAMS.forEach(([k])=>{let c=pre[k]||0;cum[k]=W.map(w=>c+=(w.tp[k]||0))});
  const mx=Math.max(1,...TEAMS.map(([k])=>cum[k][n-1])),Y=v=>PT+IH-v/mx*IH,X=i=>PL+(n>1?i*IW/(n-1):IW/2);let s=grid(mx,Y);
  TEAMS.forEach(([k])=>{s+=`<polyline points="${cum[k].map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke-width="2.5" style="stroke:var(--${k})"/>`+cum[k].map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" style="fill:var(--${k})"/>`).join("")});
  W.forEach((w,i)=>s+=xl(i,n,X(i),sd2(w.m)));return svg(s)}
function shareC(){const c={p:0,e:0,a:0,l:0};Object.values(S.rec).forEach(r=>Object.values(r).forEach(s=>c[s]++));
  const t=c.p+c.e+c.a+c.l;if(!t)return'<div class="empty">ยังไม่มีข้อมูล</div>';
  return `<div class="sb">${["p","e","a","l"].map(k=>c[k]?`<i style="width:${c[k]/t*100}%;background:var(--${SC[k]})"></i>`:"").join("")}</div>`+
  lg(["p","e","a","l"].map(k=>[SC[k],`${ST[k]} ${c[k]}`]))+`<div class="sub" style="margin-top:6px">ปกติ (มาตรวจ + แจ้งก่อน) ${Math.round((c.p+c.e)/t*100)}% จากทั้งหมด ${t} ครั้ง</div>`}

function vSum(){
  const P=pen(),L=Object.entries(P).map(([k,v])=>({k,...v})).sort((x,y)=>y.d.localeCompare(x.d)||x.id-y.id);
  const per={},tm=Object.fromEntries(TEAMS.map(t=>[t[0],{n:0,left:0}]));
  S.people.forEach(p=>per[p.id]={a:0,l:0,left:0});
  L.forEach(x=>{const p=S.people[x.id-1];per[x.id][x.s]++;tm[p.team].n++;if(!S.done[x.k]){per[x.id].left+=x.pieces;tm[p.team].left+=x.pieces}});
  const tiles=TEAMS.map(([k,l])=>`<div class="t" style="--c:var(--${k})"><b>คณะสี${l}</b><div class="n" style="color:${tm[k].left?"var(--no)":"inherit"}">${tm[k].left}</div><div class="sub">ชิ้นค้างเก็บ · โดนโทษ ${tm[k].n} ครั้ง</div></div>`).join("");
  const t0=mon(todayStr());let a=t0,z=t0;Object.keys(S.rec).forEach(d=>{const m=mon(d);a=Math.min(a,m);z=Math.max(z,m)});
  const s0=Math.max(a,z-11*WK),wk=[];for(let m=s0;m<=z;m+=WK)wk.push(m);
  const W=wk.map(m=>({m,a:0,l:0,tp:{}})),pre={};
  L.forEach(x=>{const i=Math.round((mon(x.d)-s0)/WK),tt=S.people[x.id-1].team;
    if(i<0)pre[tt]=(pre[tt]||0)+x.pieces;else{W[i][x.s]++;W[i].tp[tt]=(W[i].tp[tt]||0)+x.pieces}});
  const nd='<div class="empty">ยังไม่มีผู้โดนโทษ จึงยังไม่มีกราฟ</div>',has=L.length>0;
  const c1=has?barC(W)+lg([["no","ไม่มาตรวจ ไม่แจ้ง"],["lv","ส่งรายงานช้า"]]):nd;
  const c2=has?lineC(W,pre)+lg(TEAMS.map(([k,l])=>[k,"สี"+l])):nd;
  const rank=S.people.filter(p=>per[p.id].a+per[p.id].l).sort((x,y)=>per[y.id].left-per[x.id].left).map(p=>{const z=per[p.id];
    return `<div class="li">${dotc(p.team)}<div class="g"><b>${esc(p.name)}</b><div class="sub">ไม่มาไม่แจ้ง ${z.a} · ส่งช้า ${z.l}</div></div>${z.left?`<span class="cnt">ค้าง ${z.left} ชิ้น</span>`:`<span class="good pn" style="margin:0">ครบแล้ว</span>`}</div>`}).join("");
  const hist=(showAll?L:L.slice(0,30)).map(x=>{const p=S.people[x.id-1],d=S.done[x.k];
    return `<div class="li">${dotc(p.team)}<div class="g"><b>${esc(p.name)}</b><div class="sub">${sd(U(x.d))} · ${ST[x.s]} · ครั้งที่ ${x.n}</div></div><span class="cnt" style="${d?"opacity:.5":""}">${x.pieces} ชิ้น</span><button class="dn ${d?"on":""}" data-dn="${x.k}">${d?"เก็บแล้ว":"ยังไม่เก็บ"}</button></div>`}).join("");
  return `<div class="card"><h2>ขยะที่ยังค้างเก็บ แยกตามคณะสี</h2><div class="tg">${tiles}</div></div>
  <div class="card"><h2>แนวโน้มรายสัปดาห์ (จำนวนครั้งที่โดนโทษ)</h2>${c1}</div>
  <div class="card"><h2>ขยะสะสมที่ถูกลงโทษ แยกคณะสี (ชิ้น)</h2>${c2}</div>
  <div class="card"><h2>สัดส่วนผลการเช็คทั้งหมด</h2>${shareC()}</div>
  <div class="card"><h2>รายคน</h2>${rank||'<div class="empty">ยังไม่มีใครโดนโทษ</div>'}</div>
  <div class="card"><h2>ประวัติการโดนโทษ</h2>${hist||'<div class="empty">ยังไม่มีประวัติ</div>'}${L.length>30?`<button data-a="all" style="width:100%;margin-top:8px">${showAll?"แสดงเฉพาะ 30 รายการล่าสุด":"แสดงทั้งหมด "+L.length+" รายการ"}</button>`:""}</div>`;
}

function vSet(){
  const teams=TEAMS.map(([k,l],ti)=>`<div class="card" style="border-left:6px solid var(--${k})"><h2>คณะสี${l}</h2>${[0,1,2].map(g=>`<div class="fld"><input data-pn="${g*5+ti+1}" value="${esc(S.people[g*5+ti].name)}" aria-label="ชื่อ"></div>`).join("")}</div>`).join("");
  return `<div class="card"><h2>รอบชุดตรวจ</h2><div class="fld"><label for="an">วันที่ในสัปดาห์ที่ใช้ชุด A</label><input type="date" id="an" value="${S.anchor}"></div>
  <div class="sub">วนต่อไป A → B → C → A สัปดาห์นี้คือชุด ${setOf(todayStr())}</div></div>
  <div class="card"><h2>บทลงโทษ</h2>
  <div class="fld"><label for="ba">ไม่มาตรวจและไม่แจ้ง (ชิ้น)</label><input type="number" id="ba" min="1" value="${S.base.a}"></div>
  <div class="fld"><label for="bl">ส่งรายงานช้า (ชิ้น)</label><input type="number" id="bl" min="1" value="${S.base.l}"></div>
  <div class="fld"><label for="md">คูณ 2 ทุกครั้งที่โดนซ้ำ</label><select id="md"><option value="type" ${S.mode==="type"?"selected":""}>นับแยกตามประเภทโทษ</option><option value="all" ${S.mode==="all"?"selected":""}>นับรวมทุกประเภทโทษ</option></select></div></div>
  <div class="card"><h2>ข้อมูล</h2><div class="sub" style="margin-bottom:8px">${db?"ข้อมูลซิงก์ผ่านระบบกลางของ Claude ทุกเครื่องเห็นตรงกัน":"ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ควรส่งออกสำรองเป็นระยะ"}</div>
  <button data-a="csv" style="width:100%">ส่งออกเป็นไฟล์ CSV (เปิดใน Excel)</button></div>
  <div class="sub" style="margin:0 0 8px">ชื่อสมาชิก (แก้ได้)</div>${teams}`;
}

async function exportCsv(){
  const P=pen(),rows=[["วันที่","วัน","ชุด","คณะสี","ชื่อ","สถานะ","ชิ้นขยะ","ครั้งที่โดนโทษ","เก็บแล้ว"]];
  Object.keys(S.rec).sort().forEach(d=>Object.keys(S.rec[d]).map(Number).sort((x,y)=>x-y).forEach(id=>{const s=S.rec[d][id],x=P[d+"|"+id],p=S.people[id-1];
    rows.push([d,DAYS[dow(d)],setOf(d),TN[p.team],p.name,ST[s],x?x.pieces:0,x?x.n:0,x?(S.done[d+"|"+id]?"ใช่":"ไม่"):""])}));
  const text="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),name="ตรวจเขตพื้นที่-"+todayStr()+".csv";
  try{const D=await claude.use("downloads");if(D){await D.save({filename:name,data:text});return}}catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();
}

/* ---------- เหตุการณ์ ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  const ok=()=>{if(db&&!canWrite){toast("ไม่มีสิทธิ์บันทึกข้อมูล");return false}return true};
  if(d.v)view=d.v;
  else if(d.pick){const m=wkFor(d.pick),t=todayStr();date=m===mon(t)&&dow(t)<5?t:fmt(m);view="check"}
  else if(d.a==="gotoday"){date=todayStr();view="check"}
  else if(d.wk)date=fmt(U(date)+ +d.wk*DY);
  else if(d.day)date=d.day;
  else if(d.m){if(ok())setRec(+d.m,d.s);return}
  else if(d.dn){if(ok())togDone(d.dn);return}
  else if(d.a==="all")showAll=!showAll;
  else if(d.a==="csv"){exportCsv();return}
  else return;
  render();
});
document.addEventListener("change",e=>{const t=e.target,i=t.id;
  if(db&&!canWrite){toast("ไม่มีสิทธิ์บันทึกข้อมูล");return}
  if(i==="an"&&t.value)S.anchor=t.value;
  else if(i==="md")S.mode=t.value;
  else if(i==="ba"||i==="bl")S.base[i==="ba"?"a":"l"]=Math.max(1,parseInt(t.value)||1);
  else if(t.dataset.pn){const n=t.value.trim();if(n)S.people[t.dataset.pn-1].name=n;saveCfg();return}
  else return;
  saveCfg();render()});

const refresh=()=>{if(!/INPUT|SELECT/.test(document.activeElement.tagName))render()};
(async()=>{
  render();
  let cl=null;try{cl=await claude.use("db")}catch(e){}
  if(!cl){try{LD=JSON.parse(localStorage.getItem(LS))||LD}catch(e){}lload();ld=true;render();return}
  db=cl;
  try{const u=await claude.use("user");if(u&&u.can){const c=await u.can("data.write");if(c===false)canWrite=false}}catch(e){}
  const er=e=>toast("เชื่อมต่อไม่สำเร็จ ("+((e&&e.code)||"error")+")");
  db.doc("config/main").onSnapshot(s=>{applyCfg(s.data());rd.c=1;ld=!!(rd.c&&rd.r);refresh()},er);
  db.collection("rec").onSnapshot(s=>{applyRecs(s.docs.map(x=>x.data()));rd.r=1;ld=!!(rd.c&&rd.r);refresh()},er);
})();
</script>
